name: industrial-iot-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-backend

  redis:
    image: redis:7.4-alpine
    container_name: iot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-change_me_redis}", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-backend

  mongodb:
   image: mongo:7
   container_name: iot-mongodb
   restart: unless-stopped
   environment:
     MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-iot_mongo_user}
     MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change_me_mongo}
     MONGO_INITDB_DATABASE: ${MONGO_DB:-iot_readmodels}
   ports:
     - "127.0.0.1:${MONGO_PORT:-27017}:27017"
   volumes:
     - mongodb_data:/data/db
   healthcheck:
     test:
       [
         "CMD-SHELL",
         "mongosh --quiet --username ${MONGO_USER:-iot_mongo_user} --password ${MONGO_PASSWORD:-change_me_mongo} --authenticationDatabase admin --eval 'db.adminCommand(\"ping\").ok'"
       ]
     interval: 15s
     timeout: 10s
     retries: 10
   networks:
     - iot-backend

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  iot-backend:
   driver: bridge
