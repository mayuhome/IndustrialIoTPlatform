<section class="auth-card">
	<h1>Operator Login</h1>
	<p class="subline">Access real-time factory telemetry and management controls.</p>

	<form class="auth-form" novalidate>
		<label>
			<span>Account</span>
			<input type="email" placeholder="operator@plant.local" />
		</label>

		<label>
			<span>Password</span>
			<input type="password" placeholder="Enter your password" />
		</label>

		<button type="button">Sign In</button>
	</form>

	<p class="switch-link">
		No account?
		<a routerLink="/register">Register now</a>
	</p>
</section>
